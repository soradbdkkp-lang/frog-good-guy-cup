name: Publish Good Guy Cup
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: good-guy-cup-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: node --test tests/*.test.cjs
      - run: node scripts/build.cjs --production
        env:
          GGC_FORM_URL: ${{ vars.GGC_FORM_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 3
          done
          echo 'The GitHub Pages artifact is not available.' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
