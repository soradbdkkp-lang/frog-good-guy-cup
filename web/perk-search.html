<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パーク検索 | ふろぐ Good Guy Cup</title>
<style>
  :root{color-scheme:dark;--bg:#131915;--panel:#1a221c;--card:#1b251e;--line:#354639;--text:#f0f2e9;--muted:#b4c1b5;--accent:#c9e8a3;--warm:#ecd2a8;--danger:#fac5b8;font:16px/1.55 system-ui,"Yu Gothic UI",Meiryo,sans-serif}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text)}
  button,input,select{font:inherit;color:inherit}
  button,select{cursor:pointer}
  a{color:var(--accent);text-underline-offset:.25em}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .shell{width:min(1090px,calc(100% - 48px));margin-inline:auto}
  .top{border-bottom:1px solid var(--line);background:#161e18}
  .top .shell{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:.95rem}
  .mark{display:grid;place-items:center;width:31px;height:31px;border:1px dashed #7a9562;border-radius:8px;background:#2e3d2a;color:var(--accent);font-weight:800}
  .preview{font-size:.875rem;color:var(--muted)}
  .tournament-nav{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.875rem}
  .hero{background:#202e23;border-bottom:1px solid var(--line)}
  .hero .shell{position:relative;isolation:isolate;padding-block:43px 45px;overflow:hidden}
  .hero .shell::after{content:"";position:absolute;z-index:-1;right:38px;top:-102px;width:285px;height:284px;transform:rotate(29deg);border:2px dashed #6e8a60;border-radius:34px;background:repeating-linear-gradient(90deg,#2c3c2b 0 40px,#324730 40px 80px);box-shadow:0 0 0 12px #2a3b2b;opacity:.68;pointer-events:none}
  h1,h2,h3,p{margin:0}
  h1{font-size:clamp(2.25rem,5vw,3.85rem);font-weight:850;line-height:1.12;letter-spacing:.04em}
  .hero p{margin-top:13px;color:#d2ddcb;max-width:35rem}
  main{padding-block:25px 46px}
  .filters{display:grid;gap:17px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .settings,.search-row{display:flex;align-items:end;gap:16px;flex-wrap:wrap}
  fieldset{border:0;padding:0;margin:0;min-inline-size:0}
  legend,.field>span{display:block;padding:0;margin-bottom:6px;color:var(--muted);font-weight:650;font-size:.875rem}
  .choices{display:flex;gap:4px;padding:4px;background:#121913;border:1px solid var(--line);border-radius:10px}
  .choices label{position:relative;cursor:pointer}
  .choices input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .choices span{display:block;padding:7px 13px;border-radius:6px;white-space:nowrap;font-size:.95rem}
  .choices input:checked+span{color:#152115;background:var(--accent);font-weight:750}
  .choices input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .search-row{align-items:end}
  .search-field{flex:2.4 1 290px}
  .select-field{flex:1 1 120px;min-width:110px}
  input[type=search],select,.clear{min-height:44px;border:1px solid var(--line);border-radius:8px;background:#121913;padding:8px 11px}
  input[type=search],select{width:100%}
  input::placeholder{color:#97a698}
  select{appearance:none;padding-right:31px;background-image:linear-gradient(45deg,transparent 50%,#aab8a7 50%),linear-gradient(135deg,#aab8a7 50%,transparent 50%);background-position:calc(100% - 15px) 19px,calc(100% - 10px) 19px;background-size:5px 5px;background-repeat:no-repeat}
  .clear{padding-inline:15px;color:var(--warm)}
  .clear:hover{background:#2c362b}
  .filter-note{color:var(--muted);font-size:.875rem}
  .results-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px 16px;margin:25px 0 13px}
  h2{font-size:1.3rem}
  #result-count{color:var(--muted);font-size:.95rem}
  .context{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .context span{border:1px solid var(--line);background:#1a251b;border-radius:7px;padding:5px 10px;color:#d3dfce;font-size:.875rem}
  .grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .card{min-width:0;display:grid;grid-template-columns:49px minmax(0,1fr);align-content:start;gap:9px 12px;padding:15px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .media{display:grid;place-items:center;min-width:0;width:49px;height:49px;border:1px dashed #63775f;border-radius:9px;background:#26372a;color:#afc4a9;text-align:center;font-size:.625rem;line-height:1.25}
  .media img{display:block;width:100%;height:100%;object-fit:contain}
  .card h3{font-size:1.05rem;overflow-wrap:anywhere;line-height:1.3}
  .english-name{font-size:.875rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .status{display:inline-block;margin-top:5px;padding:1px 7px;border-radius:5px;background:#30442a;color:#d7f1bb;font-size:.875rem;font-weight:700}
  .status.blocked{background:#442e28;color:var(--danger)}
  .category,.effect{grid-column:1/-1;font-size:.875rem}
  .category{color:var(--warm)}
  .effect{color:#dce6d9}
  .effect.pending{color:var(--muted)}
  .perk-sources{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem}
  .perk-sources a{color:var(--muted)}
  .empty{border:1px dashed #526654;padding:24px;border-radius:12px;color:var(--muted)}
  .builder{margin-top:18px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .builder-head,.players,.builder-controls,.save-row{display:flex;gap:12px;flex-wrap:wrap}
  .builder-head{justify-content:space-between;align-items:center;margin-bottom:10px}
  .builder-state{color:var(--accent);font-weight:700}
  .builder-state.invalid,.violations{color:var(--danger)}
  .violations{margin:0 0 12px;padding-left:1.35em}
  .players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .player{display:grid;gap:6px;padding:10px;border:1px solid var(--line);background:#151e17;border-radius:10px}
  .player legend{padding:0 5px}
  .slot{display:grid;grid-template-columns:1.1em minmax(0,1fr);gap:6px;align-items:center;color:var(--muted);font-size:.875rem}
  .slot select{min-height:37px;padding-block:5px;background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px}
  .slot select[aria-invalid=true]{border-color:#e7a391;color:var(--danger)}
  .builder-controls{margin-top:14px;justify-content:space-between;align-items:end}
  .builder-controls>.field{width:min(100%,235px)}
  .save-row{align-items:end;gap:8px}
  .save-row .field{min-width:145px;flex:1}
  .save-row input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#121913;padding:8px 11px}
  .saved-controls{border-top:1px solid var(--line);margin-top:14px;padding-top:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .save-feedback{min-height:1.55em;margin-top:6px;color:var(--muted);overflow-wrap:anywhere;font-size:.875rem}
  .add-perk{grid-column:1/-1;justify-self:start;min-height:38px;border:1px solid #5b7255;border-radius:7px;background:#253626;color:var(--accent);padding:5px 10px;font-size:.875rem}
  .add-perk:hover{background:#354b32}
  .card-feedback{grid-column:1/-1;color:var(--muted);font-size:.875rem}
  footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--muted);font-size:.875rem}
  @media(max-width:820px){.grid,.players{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:565px){
    .shell{width:calc(100% - 30px)} .hero .shell{padding-block:31px 34px}
    .hero .shell::after{right:-115px;opacity:.34}
    .settings,.search-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .choices span{padding:7px 8px;font-size:.875rem}.search-field{grid-column:1/-1}
    .clear{justify-self:start}.filters{padding:13px;gap:13px}.grid{grid-template-columns:1fr}
    .builder{padding:13px}.saved-controls{grid-template-columns:1fr}
  }
  @media(max-width:365px){.settings,.players{grid-template-columns:1fr}.choices{width:max-content}}
</style>
</head>
<body>
<header class="top"><div class="shell">
  <div class="brand"><span class="mark" aria-hidden="true">ふ</span><span>ふろぐ Good Guy Cup</span></div>
  <nav class="tournament-nav" aria-label="大会サイト">
    <a href="https://soradbdkkp-lang.github.io/frog-good-guy-cup/">大会概要</a>
    <a href="https://soradbdkkp-lang.github.io/frog-good-guy-cup/perk-rules.html#perk-rules">サバイバー制限</a>
    <a href="https://soradbdkkp-lang.github.io/frog-good-guy-cup/killer-rules.html#killer-perks">キラー制限</a>
  </nav>
</div></header>
<section class="hero"><div class="shell">
  <h1>パーク検索</h1>
  <p>名前や効果からパークを探し、マップ区分ごとの使用可否と制限を確認できます。</p>
</div></section>
<main class="shell">
  <form class="filters" id="filters" aria-label="検索条件">
    <div class="settings">
      <fieldset><legend>役割</legend><div class="choices">
        <label><input type="radio" name="role" value="survivor" checked><span>サバイバー</span></label>
        <label><input type="radio" name="role" value="killer"><span>チャッキー</span></label>
      </div></fieldset>
      <fieldset><legend>マップ区分</legend><div class="choices">
        <label><input type="radio" name="map" value="indoor" checked><span>室内</span></label>
        <label><input type="radio" name="map" value="outdoor"><span>屋外</span></label>
      </div></fieldset>
    </div>
    <div class="search-row">
      <label class="field search-field"><span>キーワード</span><input type="search" name="query" placeholder="例　デッハ、自己治療、Dead Hard" autocomplete="off"></label>
      <label class="field select-field"><span>制限カテゴリ</span><select name="category"></select></label>
      <label class="field select-field"><span>使用可否</span><select name="availability">
        <option value="">すべて</option><option value="allowed">使用可のみ</option><option value="blocked">使用不可のみ</option>
      </select></label>
      <button type="button" class="clear" id="clear">絞り込み解除</button>
    </div>
    <p class="filter-note" id="catalog-note"></p>
  </form>
  <section class="builder" id="builder" aria-labelledby="builder-title">
    <div class="builder-head"><h2 id="builder-title">パーク構成</h2><p class="builder-state" id="builder-state" role="status"></p></div>
    <div class="context" id="builder-counts" aria-label="現在の使用枠"></div>
    <ul class="violations" id="builder-violations" aria-label="構成の違反" hidden></ul>
    <div class="players" id="builder-players"></div>
    <div class="builder-controls">
      <label class="field" id="add-player-field"><span>検索結果から追加する先</span><select id="add-player"></select></label>
      <a href="#results-title">検索結果を見る</a>
    </div>
    <div class="saved-controls">
      <form class="save-row" id="save-form">
        <label class="field"><span>保存名</span><input id="build-name" maxlength="50" required placeholder="例　屋外用"></label>
        <button type="submit" class="clear">保存</button>
      </form>
      <form class="save-row" id="load-form">
        <label class="field"><span>保存済みの構成</span><select id="saved-builds"></select></label>
        <button type="submit" class="clear" id="load-build">読み込む</button>
      </form>
    </div>
    <p class="save-feedback" id="save-feedback" role="status"></p>
  </section>
  <section aria-labelledby="results-title">
    <div class="results-heading"><h2 id="results-title">検索結果</h2><p id="result-count" role="status"></p></div>
    <div class="context" id="context" aria-label="選択中の制限"></div>
    <p class="empty" id="empty" hidden>該当するパークが見つかりません。キーワードや絞り込み条件を変更してください。</p>
    <ul id="results" class="grid"></ul>
  </section>
</main>
<footer><div class="shell"><a id="rules">参照したパーク判定表</a><span id="version"></span></div></footer>

<script type="application/json" id="cup-data">{"schemaVersion":1,"tournamentId":"good-guy-cup","name":"ふろぐ Good Guy Cup","rulesVersion":"2026-11-21","source":"https://chatgpt.com/library?file_id=libfile_e9b805847dc48191ba6d179cddd1418d&account_id=personal","verification":"site-preview","categories":{"healing":"回復系","generator":"発電機系","hook":"フック系","exhaustion":"疲労系","stealth-rescue":"隠密・救助系","aura":"オーラ系","other":"その他"},"roles":{"survivor":{"playerCount":4,"maxPerPlayer":4,"maxCopiesPerTeam":1,"eligibility":{"mode":"allowlist","perkIds":["s-001","s-002","s-003","s-004","s-005","s-006","s-007","s-008","s-009","s-010","s-011","s-012","s-013","s-014","s-015","s-016","s-017","s-018","s-019","s-020","s-021","s-022","s-023","s-024","s-025","s-026","s-027","s-028","s-029","s-030","s-031","s-032","s-033","s-034","s-035","s-036","s-037","s-038","s-039","s-040","s-041","s-042","s-043","s-044","s-045","s-046","s-047","s-048","s-049","s-050","s-051","s-052","s-053","s-054","s-055","s-056"]},"categoryByPerkId":{"s-001":"healing","s-002":"healing","s-003":"healing","s-004":"healing","s-005":"healing","s-006":"healing","s-007":"healing","s-008":"healing","s-009":"healing","s-010":"healing","s-011":"healing","s-012":"healing","s-013":"healing","s-014":"healing","s-015":"healing","s-016":"healing","s-017":"generator","s-018":"generator","s-019":"generator","s-020":"generator","s-021":"hook","s-022":"hook","s-023":"hook","s-024":"hook","s-025":"hook","s-026":"exhaustion","s-027":"exhaustion","s-028":"exhaustion","s-029":"exhaustion","s-030":"exhaustion","s-031":"exhaustion","s-032":"exhaustion","s-033":"stealth-rescue","s-034":"stealth-rescue","s-035":"stealth-rescue","s-036":"stealth-rescue","s-037":"stealth-rescue","s-038":"stealth-rescue","s-039":"stealth-rescue","s-040":"aura","s-041":"aura","s-042":"aura","s-043":"aura","s-044":"aura","s-045":"aura","s-046":"aura","s-047":"aura","s-048":"aura","s-049":"aura","s-050":"other","s-051":"other","s-052":"other","s-053":"other","s-054":"other","s-055":"other","s-056":"other"}},"killer":{"label":"チャッキー","playerCount":1,"maxPerPlayer":4,"maxCopiesPerTeam":1,"eligibility":{"mode":"denylist","perkIds":["k-001","k-002"]},"categoryByPerkId":{}}},"mapProfiles":{"indoor":{"label":"室内","roles":{"survivor":{"maxTeamTotal":12,"categoryCaps":{"healing":3,"generator":1,"hook":3,"exhaustion":3,"stealth-rescue":2,"aura":1,"other":null}},"killer":{"maxTeamTotal":4,"categoryCaps":{}}}},"outdoor":{"label":"屋外","roles":{"survivor":{"maxTeamTotal":10,"categoryCaps":{"healing":2,"generator":1,"hook":3,"exhaustion":2,"stealth-rescue":1,"aura":1,"other":null}},"killer":{"maxTeamTotal":4,"categoryCaps":{}}}}}}</script>
<script>
  const catalog = JSON.parse(document.getElementById('perk-data').textContent);
  const tournament = JSON.parse(document.getElementById('cup-data').textContent);
  const form = document.getElementById('filters');
  const fields = form.elements;
  const results = document.getElementById('results');
  const count = document.getElementById('result-count');
  const context = document.getElementById('context');
  const empty = document.getElementById('empty');

  function normalize(value) {
    return value.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').normalize('NFKC').toLowerCase()
      .replace(/[ァ-ヶ]/g, character => String.fromCharCode(character.charCodeAt(0) - 96))
      .replace(/[\s・･]/g, '');
  }

  const perks = catalog.perks.map(perk => ({
    ...perk,
    searchable: [
      ...Object.values(perk.names), ...perk.aliases.ja, perk.effectSummary.ja ?? '', ...perk.effectTags.ja
    ].map(normalize)
  }));

  function element(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content) node.textContent = content;
    return node;
  }

  function updateCategoryOptions(role) {
    const select = fields.namedItem('category');
    const categories = new Set(Object.values(tournament.roles[role].categoryByPerkId));
    const options = Object.entries(tournament.categories)
      .filter(([id]) => categories.has(id))
      .map(([id, label]) => new Option(label, id));
    select.replaceChildren(new Option(options.length ? 'すべて' : 'カテゴリ指定なし', ''), ...options);
    select.disabled = options.length === 0;
  }

  function isAllowed(rules, perkId) {
    return rules.eligibility.perkIds.includes(perkId) === (rules.eligibility.mode === 'allowlist');
  }

  function perkCard(perk, allowed, category, cap, mode) {
    const card = element('li', 'card');
    const media = element('div', 'media');
    media.setAttribute('aria-hidden', 'true');
    if (perk.image?.path) {
      const image = element('img');
      image.alt = '';
      image.loading = 'lazy';
      image.addEventListener('error', () => { media.textContent = '画像取得不可'; }, {once: true});
      image.src = perk.image.path;
      media.append(image);
    } else {
      media.textContent = '画像未登録';
    }
    const heading = element('div');
    heading.append(element('h3', '', perk.names.ja));
    if (perk.names.en) {
      const english = element('p', 'english-name', perk.names.en);
      english.lang = 'en';
      heading.append(english);
    }
    heading.append(element('span', allowed ? 'status' : 'status blocked', allowed ? '使用可' : '使用不可'));
    card.append(media, heading);

    if (category) {
      const limit = cap == null ? 'チームの総枠内' : 'チームで最大' + cap + '個';
      card.append(element('p', 'category', tournament.categories[category] + ' ／ ' + limit));
    } else if (!allowed) {
      card.append(element('p', 'category', mode === 'allowlist' ? '大会の使用可能一覧に未掲載' : '大会ルールで使用禁止'));
    } else {
      card.append(element('p', 'category', '大会の個別パーク制限なし'));
    }
    const effect = perk.effectSummary.ja;
    card.append(element('p', effect ? 'effect' : 'effect pending', effect || '効果説明は準備中'));
    const sources = element('div', 'perk-sources');
    for (const [url, label] of [
      [perk.effectSource ?? perk.reference, effect ? '効果の参照元' : 'パーク一覧で確認'],
      [perk.englishSource, '英語のパーク情報'],
      [perk.image?.source, 'アイコンの出典']
    ]) {
      if (!url) continue;
      const link = element('a', '', label);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      sources.append(link);
    }
    if (sources.childElementCount) card.append(sources);
    const add = element('button', 'add-perk', '構成に追加');
    const addFeedback = element('p', 'card-feedback');
    addFeedback.hidden = true;
    add.type = 'button';
    add.setAttribute('aria-label', perk.names.ja + 'を構成に追加');
    add.addEventListener('click', () => {
      addFeedback.textContent = addPerk(perk);
      addFeedback.hidden = false;
    });
    card.append(add, addFeedback);
    return card;
  }

  function render() {
    const role = fields.namedItem('role').value;
    const map = fields.namedItem('map').value;
    const terms = fields.namedItem('query').value.split(/\s+/).map(normalize).filter(Boolean);
    const categoryFilter = fields.namedItem('category').value;
    const availability = fields.namedItem('availability').value;
    const rules = tournament.roles[role];
    const profile = tournament.mapProfiles[map];
    const limits = profile.roles[role];
    const {mode} = rules.eligibility;
    const visible = document.createDocumentFragment();
    let matches = 0;
    let total = 0;

    for (const perk of perks) {
      if (perk.role !== role) continue;
      total += 1;
      const category = rules.categoryByPerkId[perk.id];
      const allowed = isAllowed(rules, perk.id);
      if (categoryFilter && category !== categoryFilter) continue;
      if (availability && allowed !== (availability === 'allowed')) continue;
      if (!terms.every(term => perk.searchable.some(value => value.includes(term)))) continue;
      visible.append(perkCard(perk, allowed, category, limits.categoryCaps[category], mode));
      matches += 1;
    }

    const totalLabel = role === 'survivor' ? 'サバイバー4人で最大' : 'チャッキー最大';
    context.replaceChildren(element('span', '', profile.label + 'マップ'),
      element('span', '', totalLabel + limits.maxTeamTotal + '枠'));
    if (role === 'survivor') {
      context.append(element('span', '', '1人最大' + rules.maxPerPlayer + '枠'),
        element('span', '', 'チーム内重複不可'));
    }
    count.textContent = matches + ' / ' + total + '件';
    empty.hidden = matches > 0;
    results.replaceChildren(visible);
  }


  const byPerkId = new Map(perks.map(perk => [perk.id, perk]));
  const storageKey = 'frog-cup:perk-builds:v1:' + tournament.tournamentId;
  const players = document.getElementById('builder-players');
  const addPlayer = document.getElementById('add-player');
  const buildState = document.getElementById('builder-state');
  const buildCounts = document.getElementById('builder-counts');
  const violations = document.getElementById('builder-violations');
  const buildName = document.getElementById('build-name');
  const savedBuilds = document.getElementById('saved-builds');
  const loadButton = document.getElementById('load-build');
  const feedback = document.getElementById('save-feedback');
  const drafts = new Map();
  const targetPlayers = new Map();
  const slotControls = [];

  function selectedRole() {
    return fields.namedItem('role').value;
  }

  function selectedMap() {
    return fields.namedItem('map').value;
  }

  function playerName(role, index) {
    return role === 'survivor' ? 'サバイバー ' + (index + 1) : tournament.roles[role].label ?? 'キラー';
  }

  function draft(role) {
    const {playerCount, maxPerPlayer} = tournament.roles[role];
    if (!drafts.has(role)) {
      drafts.set(role, Array.from({length:playerCount}, () => Array(maxPerPlayer).fill('')));
    }
    return drafts.get(role);
  }

  function renderPlayerSlots() {
    const role = selectedRole();
    const rules = tournament.roles[role];
    const options = perks.filter(perk => perk.role === role).map(perk => {
      const suffix = isAllowed(rules, perk.id) ? '' : '（使用不可）';
      return new Option(perk.names.ja + suffix, perk.id);
    });
    const rows = draft(role);
    slotControls.length = 0;
    const groups = rows.map((slots, playerIndex) => {
      const group = element('fieldset', 'player');
      const name = playerName(role, playerIndex);
      group.append(element('legend', '', name));
      const controls = slots.map((perkId, slotIndex) => {
        const label = element('label', 'slot');
        const control = element('select');
        control.setAttribute('aria-label', name + ' パーク ' + (slotIndex + 1));
        control.append(new Option('空き枠', ''), ...options.map(option => option.cloneNode(true)));
        if (perkId && !options.some(option => option.value === perkId)) {
          control.add(new Option((byPerkId.get(perkId)?.names.ja ?? perkId) + '（確認が必要）', perkId));
        }
        control.value = perkId;
        control.addEventListener('change', () => {
          slots[slotIndex] = control.value;
          validateBuild();
        });
        label.append(element('span', '', String(slotIndex + 1)), control);
        group.append(label);
        return control;
      });
      slotControls.push(controls);
      return group;
    });
    players.replaceChildren(...groups);
    addPlayer.replaceChildren(...rows.map((_, index) => new Option(playerName(role,index), String(index))));
    addPlayer.value = String(Math.min(targetPlayers.get(role) ?? 0, rows.length - 1));
    document.getElementById('add-player-field').hidden = rows.length === 1;
    validateBuild();
  }

  function validateBuild() {
    const role = selectedRole();
    const rules = tournament.roles[role];
    const limits = tournament.mapProfiles[selectedMap()].roles[role];
    const issues = [];
    const selections = [];
    const byCategory = new Map();
    const byId = new Map();
    const mark = (items, message) => {
      issues.push(message);
      for (const item of items) item.control.setAttribute('aria-invalid', 'true');
    };

    for (const [playerIndex, slots] of draft(role).entries()) {
      const playerSelections = [];
      for (const [slotIndex, perkId] of slots.entries()) {
        const control = slotControls[playerIndex][slotIndex];
        control.removeAttribute('aria-invalid');
        if (!perkId) continue;
        const selection = {control, playerIndex};
        playerSelections.push(selection);
        selections.push(selection);
        const perk = byPerkId.get(perkId);
        if (!perk || perk.role !== role) {
          mark([selection], playerName(role, playerIndex) + ' の ' + (perk?.names.ja ?? perkId) + ' は、この役割のパーク辞書で確認できません。');
        } else if (!isAllowed(rules, perkId)) {
          mark([selection], playerName(role, playerIndex) + ' の「' + perk.names.ja + '」は使用不可です。');
        }
        const category = rules.categoryByPerkId[perkId];
        if (category) byCategory.set(category, [...(byCategory.get(category) ?? []), selection]);
        byId.set(perkId, [...(byId.get(perkId) ?? []), selection]);
      }
      if (playerSelections.length > rules.maxPerPlayer) {
        mark(playerSelections, playerName(role, playerIndex) + ' は最大' + rules.maxPerPlayer + '枠です。');
      }
      if (playerIndex >= rules.playerCount && playerSelections.length) {
        mark(playerSelections, playerName(role, playerIndex) + ' は今回の出場枠に含まれません。');
      }
    }

    const used = selections.length;
    if (used > limits.maxTeamTotal) {
      issues.push('合計枠を' + (used - limits.maxTeamTotal) + '枠超えています。');
    }
    for (const [id, items] of byId) {
      if (items.length <= rules.maxCopiesPerTeam) continue;
      const names = [...new Set(items.map(item => playerName(role, item.playerIndex)))];
      mark(items, '「' + (byPerkId.get(id)?.names.ja ?? id) + '」の重複（' + names.join('、') + '）。');
    }

    const labels = [element('span', '', '合計 ' + used + ' / ' + limits.maxTeamTotal + '枠')];
    for (const [category, cap] of Object.entries(limits.categoryCaps)) {
      const items = byCategory.get(category) ?? [];
      const label = tournament.categories[category];
      const usage = cap == null ? items.length + '個（総枠内）' : items.length + ' / ' + cap;
      labels.push(element('span', '', label + ' ' + usage));
      if (cap != null && items.length > cap) {
        mark(items, label + 'を' + (items.length - cap) + '個超えています。');
      }
    }
    buildCounts.replaceChildren(...labels);
    violations.replaceChildren(...issues.map(issue => element('li', '', issue)));
    violations.hidden = issues.length === 0;
    buildState.classList.toggle('invalid', issues.length > 0);
    buildState.textContent = issues.length ? '要修正' : used ? 'パーク制限に適合' : 'パーク未選択';
    return {used, issues};
  }

  function addPerk(perk) {
    const role = selectedRole();
    const playerIndex = Number(addPlayer.value);
    const slots = draft(role)[playerIndex];
    const slotIndex = slots.slice(0,tournament.roles[role].maxPerPlayer).indexOf('');
    if (slotIndex === -1) {
      feedback.textContent = playerName(role, playerIndex) + ' に空き枠がありません。';
      return feedback.textContent;
    }
    slots[slotIndex] = perk.id;
    slotControls[playerIndex][slotIndex].value = perk.id;
    validateBuild();
    feedback.textContent = playerName(role, playerIndex) + ' に「' + perk.names.ja + '」を追加しました。';
    return playerName(role, playerIndex) + ' に追加しました。';
  }

  function readSavedBuilds() {
    const stored = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
    if (!Array.isArray(stored)) throw new Error('Invalid saved builds');
    return stored.filter(build =>
      build && typeof build.id === 'string' && typeof build.name === 'string' &&
      typeof build.rulesVersion === 'string' &&
      Object.hasOwn(tournament.roles, build.role) && Object.hasOwn(tournament.mapProfiles, build.map) &&
      Array.isArray(build.players) &&
      build.players.every(slots => Array.isArray(slots) && slots.every(id => typeof id === 'string'))
    );
  }

  function refreshSavedBuilds(selectedId = savedBuilds.value) {
    let records = [];
    try {
      records = readSavedBuilds();
    } catch {
      feedback.textContent = 'このブラウザで保存済みの構成を読み込めません。';
    }
    const options = records.map(record => {
      const label = playerName(record.role, 0).replace(/ 1$/, '');
      const map = tournament.mapProfiles[record.map].label;
      return new Option(record.name + '（' + label + '・' + map + '）', record.id);
    });
    savedBuilds.replaceChildren(new Option(options.length ? '構成を選ぶ' : '保存済みの構成なし', ''), ...options);
    savedBuilds.value = records.some(record => record.id === selectedId) ? selectedId : '';
    savedBuilds.disabled = !options.length;
    loadButton.disabled = !savedBuilds.value;
  }

  addPlayer.addEventListener('change', () => targetPlayers.set(selectedRole(), Number(addPlayer.value)));
  savedBuilds.addEventListener('change', () => { loadButton.disabled = !savedBuilds.value; });

  document.getElementById('save-form').addEventListener('submit', event => {
    event.preventDefault();
    const name = buildName.value.trim();
    if (!name) {
      feedback.textContent = '保存名を入力してください。';
      return;
    }
    const result = validateBuild();
    if (!result.used) {
      feedback.textContent = '保存するパークを選んでください。';
      return;
    }
    const role = selectedRole();
    try {
      const id = Array.from(crypto.getRandomValues(new Uint32Array(4)), value => value.toString(16).padStart(8, '0')).join('');
      const record = {id, name, role, map: selectedMap(), rulesVersion: tournament.rulesVersion, players: draft(role)};
      localStorage.setItem(storageKey, JSON.stringify([record, ...readSavedBuilds()]));
      refreshSavedBuilds(record.id);
      feedback.textContent = result.issues.length ? '要修正の構成を下書きとして保存しました。' : '構成を保存しました。';
    } catch {
      feedback.textContent = '構成を保存できませんでした。ブラウザの保存設定を確認してください。';
    }
  });

  document.getElementById('load-form').addEventListener('submit', event => {
    event.preventDefault();
    try {
      const record = readSavedBuilds().find(build => build.id === savedBuilds.value);
      if (!record) return;
      const rules = tournament.roles[record.role];
      const restored = Array.from({length:Math.max(rules.playerCount, record.players.length)}, (_, index) => {
        const slots = record.players[index] ?? [];
        return Array.from({length:Math.max(rules.maxPerPlayer, slots.length)}, (_, slot) => slots[slot] ?? '');
      });
      drafts.set(record.role, restored);
      fields.namedItem('role').value = record.role;
      fields.namedItem('map').value = record.map;
      updateCategoryOptions(record.role);
      renderPlayerSlots();
      render();
      buildName.value = record.name;
      const previous = record.rulesVersion !== tournament.rulesVersion ? '（保存時のルール版 ' + record.rulesVersion + '）' : '';
      feedback.textContent = '構成を読み込み、現在のルールで判定しました。' + previous;
    } catch {
      feedback.textContent = '構成を読み込めませんでした。';
    }
  });


  form.addEventListener('submit', event => event.preventDefault());
  form.addEventListener('input', event => {
    if (event.target.name === 'role') {
      updateCategoryOptions(event.target.value);
      renderPlayerSlots();
    }
    if (event.target.name === 'map') validateBuild();
    render();
  });
  document.getElementById('clear').addEventListener('click', () => {
    fields.namedItem('query').value = '';
    fields.namedItem('category').value = '';
    fields.namedItem('availability').value = '';
    render();
    fields.namedItem('query').focus();
  });
  const initialRole = new URLSearchParams(location.search).get('role');
  if (initialRole === 'survivor' || initialRole === 'killer') fields.namedItem('role').value = initialRole;
  document.getElementById('rules').href =
    'https://soradbdkkp-lang.github.io/frog-good-guy-cup/perk-rules.html#perk-rules';
  document.getElementById('rules').textContent = '大会公式のパークルール';
  document.getElementById('version').textContent = ' ／ ルール参照版 ' + tournament.rulesVersion;
  const summarized = perks.filter(perk => perk.effectSummary.ja).length;
  document.getElementById('catalog-note').textContent =
    '掲載 ' + perks.length + '件。英語名と効果からの検索は登録済みの' + summarized + '件が対象です。';
  updateCategoryOptions(fields.namedItem('role').value);
  renderPlayerSlots();
  refreshSavedBuilds();
  render();
</script>
</body>
